<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小學數學：余主任</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e222b url('background.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .app-container {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 960px;
      height: 540px;
    }
    .left-panel, .right-panel {
      background-color: rgba(43, 49, 62, 0.92);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
      backdrop-filter: blur(8px);
    }
    .panel-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .avatar-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a1e26;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      padding: 10px;
    }
    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: top center;
    }
    .btn-voice {
      width: 100%;
      padding: 12px;
      background-color: #34a853;
      color: #ffffff;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn-voice:hover {
      background-color: #2d9247;
    }
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .input-row input {
      flex: 1;
      padding: 10px 14px;
      background-color: #1e222b;
      border: 1px solid #3c4250;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
    }
    .input-row button {
      padding: 10px 20px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .input-row button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
    .status-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 40px;
    }
    .status-box {
      font-size: 14px;
      color: #e0e4ec;
      line-height: 1.4;
    }
    
    /* Animated Voice Badge */
    .audio-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      font-size: 12px;
      background: rgba(66, 133, 244, 0.2);
      color: #8ab4f8;
      border: 1px solid rgba(66, 133, 244, 0.4);
      padding: 4px 10px;
      border-radius: 12px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1.0; }
      100% { opacity: 0.6; }
    }

    .history-box {
      flex: 1;
      background-color: #1a1e26;
      border-radius: 8px;
      padding: 16px;
      overflow-y: auto;
      font-size: 14px;
      color: #a0a6b5;
      line-height: 1.6;
    }
    .chat-item {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2b313e;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="left-panel">
      <div class="panel-title">小學數學：余主任</div>
      <div class="avatar-container">
        <img src="avatar.png" alt="余主任">
      </div>
      <button class="btn-voice" onclick="startVoiceInput()">🎤 按此語音發問</button>
      <div class="input-row">
        <input type="text" id="text-input" placeholder="向余主任提問..." onkeydown="if(event.key==='Enter') handleSend()">
        <button class="send" onclick="handleSend()">傳送</button>
      </div>
      
      <div class="status-container">
        <div id="status" class="status-box">余主任準備好回答問題。</div>
        <div id="audio-badge-container"></div>
      </div>
    </div>

    <div class="right-panel">
      <div class="panel-title">課堂探究紀錄</div>
      <div id="chat-history" class="history-box">與余主任的對話紀錄會顯示在此處。</div>
    </div>
  </div>

  <script>
    let chatHistory = [];
    let currentAudio = null;
    const statusEl = document.getElementById('status');
    const badgeContainer = document.getElementById('audio-badge-container');

    function showAudioBadge(text) {
      badgeContainer.innerHTML = `<span class="audio-badge">🔊 ${text}</span>`;
    }

    function clearAudioBadge() {
      badgeContainer.innerHTML = '';
    }

    function handleSend() {
      const input = document.getElementById('text-input');
      const text = input.value.trim();
      if (text) {
        input.value = '';
        sendQueryToBackend(text);
      }
    }

    function addQuestionToHistory(question, answer) {
      const historyBox = document.getElementById('chat-history');
      if (historyBox.innerHTML.includes('與余主任的對話紀錄會顯示在此處。')) {
        historyBox.innerHTML = '';
      }
      const item = document.createElement('div');
      item.className = 'chat-item';
      item.innerHTML = `<strong>問：</strong>${question}<br><strong>答：</strong>${answer}`;
      historyBox.appendChild(item);
      historyBox.scrollTop = historyBox.scrollHeight;
    }

    async function sendQueryToBackend(studentQuery) {
      const trimmedQuery = studentQuery.trim();
      if (!trimmedQuery) return;

      const sendBtn = document.querySelector('.send');
      const inputField = document.getElementById('text-input');

      if (sendBtn) sendBtn.disabled = true;
      if (inputField) inputField.disabled = true;

      statusEl.innerText = "余主任思考緊，準備回答你...";
      clearAudioBadge();

      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }

      chatHistory.push({ role: "user", content: trimmedQuery });

      try {
        // 1. Fetch text answer
        const chatRes = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chatHistory })
        });

        const chatData = await chatRes.json();

        if (!chatRes.ok || !chatData.text) {
          statusEl.innerText = `伺服器錯誤: ${chatData.text || '無法取得回應'}`;
          chatHistory.pop();
          return;
        }

        const replyText = chatData.text;
        statusEl.innerText = replyText;

        if (!replyText.includes("連線失敗") && !replyText.includes("錯誤")) {
          chatHistory.push({ role: "assistant", content: replyText });
          addQuestionToHistory(trimmedQuery, replyText);
        } else {
          chatHistory.pop();
          return;
        }

        // 2. Fetch Cantonese voice audio cleanly
        showAudioBadge("廣東話語音生成中...");

        const ttsRes = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: replyText })
        });

        const ttsData = await ttsRes.json();

        if (ttsData.audio_url) {
          showAudioBadge("播放語音中");
          currentAudio = new Audio(ttsData.audio_url);
          
          currentAudio.onended = () => {
            clearAudioBadge();
          };

          currentAudio.play().catch(e => {
            console.warn("Autoplay blocked:", e);
            clearAudioBadge();
          });
        } else {
          clearAudioBadge();
        }

      } catch (error) {
        console.error("Fetch error:", error);
        statusEl.innerText = "網絡請求失敗：" + error.message;
        clearAudioBadge();
        chatHistory.pop();
      } finally {
        if (sendBtn) sendBtn.disabled = false;
        if (inputField) {
          inputField.disabled = false;
          inputField.focus();
        }
      }
    }

    function startVoiceInput() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('你的瀏覽器不支援語音辨識功能。');
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-HK';
      statusEl.innerText = "正在聆聽...";
      recognition.start();

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('text-input').value = transcript;
        handleSend();
      };

      recognition.onerror = () => {
        statusEl.innerText = "語音辨識失敗，請重試。";
      };
    }
  </script>
</body>
</html>
