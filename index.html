<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小學數學：余主任</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #1e222b url('background.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .app-container {
      display: flex;
      gap: 24px;
      width: 100%;
      max-width: 1100px;
      height: 660px;
      position: relative;
    }
    
    .start-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(26, 30, 38, 0.96);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      gap: 24px;
      text-align: center;
      padding: 20px;
    }
    .start-overlay h2 {
      font-size: 26px;
      font-weight: bold;
      color: #ffffff;
    }
    .btn-start {
      padding: 18px 40px;
      font-size: 22px;
      font-weight: bold;
      background-color: #34a853;
      color: white;
      border: none;
      border-radius: 36px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(52, 168, 83, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }
    .btn-start:hover {
      background-color: #2d9247;
    }
    .btn-start:active {
      transform: scale(0.96);
    }

    .left-panel, .right-panel {
      background-color: rgba(43, 49, 62, 0.94);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      flex: 1;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    .panel-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 18px;
      color: #ffffff;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }
    
    .avatar-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a1e26;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 18px;
      padding: 12px;
    }
    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    
    .btn-voice {
      width: 100%;
      padding: 15px;
      background-color: #34a853;
      color: #ffffff;
      border: none;
      border-radius: 28px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 14px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-voice:active {
      transform: scale(0.98);
    }
    
    .input-row {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
    }
    .input-row input {
      flex: 1;
      padding: 12px 16px;
      background-color: #1e222b;
      border: 1px solid #3c4250;
      border-radius: 10px;
      color: #ffffff;
      font-size: 16px;
    }
    .input-row input:focus {
      outline: none;
      border-color: #4285f4;
    }
    .input-row button {
      padding: 12px 24px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .input-row button:hover {
      background-color: #3367d6;
    }
    .input-row button:disabled {
      background-color: #555555;
      cursor: not-allowed;
    }
    
    .status-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 50px;
    }
    
    .status-box {
      font-size: 16px;
      color: #e0e4ec;
      line-height: 1.5;
    }
    
    .audio-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      font-size: 14px;
      background: rgba(66, 133, 244, 0.2);
      color: #8ab4f8;
      border: 1px solid rgba(66, 133, 244, 0.4);
      padding: 6px 14px;
      border-radius: 16px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1.0; }
      100% { opacity: 0.6; }
    }

    .history-box {
      flex: 1;
      background-color: #1a1e26;
      border-radius: 12px;
      padding: 20px;
      overflow-y: auto;
      font-size: 16px;
      color: #d1d5db;
      line-height: 1.7;
    }
    .chat-item {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2b313e;
      color: #ffffff;
      word-break: break-word;
    }
    .chat-item strong {
      color: #8ab4f8;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="start-overlay" class="start-overlay">
      <h2>歡迎嚟到余主任嘅數學課堂！</h2>
      <button class="btn-start" onclick="startApp()">🎓 開始課堂</button>
    </div>

    <div class="left-panel">
      <div class="panel-title">小學數學：余主任</div>
      <div class="avatar-container">
        <img id="avatar-img" src="avatar_close.png" alt="余主任">
      </div>
      
      <button class="btn-voice" onclick="startVoiceInput()">🎤 按此語音發問</button>
      
      <div class="input-row">
        <input type="text" id="text-input" placeholder="向余主任提問..." onkeydown="if(event.key==='Enter') handleSend()">
        <button class="send" onclick="handleSend()">傳送</button>
      </div>
      
      <div class="status-container">
        <div id="status" class="status-box">余主任準備好回答問題。</div>
        <div id="audio-badge-container"></div>
      </div>
    </div>

    <div class="right-panel">
      <div class="panel-title">課堂探究紀錄</div>
      <div id="chat-history" class="history-box">與余主任的對話紀錄會顯示在此處。</div>
    </div>
  </div>

  <script>
    let chatHistory = [];
    let currentAudio = new Audio();
    let recognition = null;
    let isRecording = false;
    let silenceTimer = null;

    // Web Audio API lip-sync variables
    let audioCtx = null;
    let analyser = null;
    let source = null;
    let isAudioSetup = false;
    let lipSyncAnimationFrame = null;

    const statusEl = document.getElementById('status');
    const badgeContainer = document.getElementById('audio-badge-container');

    function setupAudioAnalyser() {
      if (isAudioSetup) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;

        source = audioCtx.createMediaElementSource(currentAudio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);

        isAudioSetup = true;
      } catch (e) {
        console.warn("Web Audio API setup error:", e);
      }
    }

    function startLipSync() {
      setupAudioAnalyser();

      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const img = document.getElementById('avatar-img');
      if (!analyser) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      function updateMouth() {
        if (currentAudio.paused || currentAudio.ended) {
          resetAvatarImage();
          return;
        }

        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        const average = sum / dataArray.length;

        if (img) {
          if (average > 12) {
            img.src = 'avatar_open.png';
          } else {
            img.src = 'avatar_close.png';
          }
        }

        lipSyncAnimationFrame = requestAnimationFrame(updateMouth);
      }

      if (lipSyncAnimationFrame) cancelAnimationFrame(lipSyncAnimationFrame);
      updateMouth();
    }

    function resetAvatarImage() {
      const img = document.getElementById('avatar-img');
      if (img) img.src = 'avatar_close.png';
      if (lipSyncAnimationFrame) cancelAnimationFrame(lipSyncAnimationFrame);
    }

    function startApp() {
      document.getElementById('start-overlay').style.display = 'none';

      const welcomeText = "你好呀！我係余主任。請問你叫咩名呀？";
      statusEl.innerText = welcomeText;
      showAudioBadge("播放語音中");

      currentAudio.src = 'welcome.mp3';

      currentAudio.onplay = () => {
        startLipSync();
      };

      currentAudio.onended = () => {
        clearAudioBadge();
        resetAvatarImage();
      };

      currentAudio.onerror = () => {
        clearAudioBadge();
        resetAvatarImage();
      };

      currentAudio.play().then(() => {
        chatHistory.push({ role: "assistant", content: welcomeText });
      }).catch(e => {
        console.warn("Autoplay blocked or welcome.mp3 missing:", e);
        clearAudioBadge();
        resetAvatarImage();
      });
    }

    function showAudioBadge(text) {
      badgeContainer.innerHTML = `<span class="audio-badge">🔊 ${text}</span>`;
    }

    function clearAudioBadge() {
      badgeContainer.innerHTML = '';
    }

    function handleSend() {
      const input = document.getElementById('text-input');
      const text = input.value.trim();
      if (text) {
        input.value = '';
        sendQueryToBackend(text);
      }
    }

    function addQuestionToHistory(question, answer) {
      const historyBox = document.getElementById('chat-history');
      if (historyBox.innerHTML.includes('與余主任的對話紀錄會顯示在此處。')) {
        historyBox.innerHTML = '';
      }
      const item = document.createElement('div');
      item.className = 'chat-item';
      item.innerHTML = `<strong>問：</strong>${question}<br><strong>答：</strong>${answer}`;
      historyBox.appendChild(item);
      historyBox.scrollTop = historyBox.scrollHeight;
    }

    async function sendQueryToBackend(studentQuery) {
      const trimmedQuery = studentQuery.trim();
      if (!trimmedQuery) return;

      const sendBtn = document.querySelector('.send');
      const inputField = document.getElementById('text-input');

      if (sendBtn) sendBtn.disabled = true;
      if (inputField) inputField.disabled = true;

      statusEl.innerText = "余主任思考緊，準備回答你...";
      clearAudioBadge();

      currentAudio.pause();
      resetAvatarImage();

      chatHistory.push({ role: "user", content: trimmedQuery });

      try {
        const chatRes = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chatHistory })
        });

        const chatData = await chatRes.json();

        if (!chatRes.ok || !chatData.text) {
          statusEl.innerText = `伺服器錯誤: ${chatData.text || '無法取得回應'}`;
          chatHistory.pop();
          return;
        }

        const replyText = chatData.text;

        if (replyText.includes("連線失敗") || replyText.includes("錯誤")) {
          statusEl.innerText = replyText;
          chatHistory.pop();
          return;
        }

        statusEl.innerText = "余主任準備緊回答同語音...";
        showAudioBadge("廣東話語音生成中...");

        const ttsRes = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: replyText })
        });

        const ttsData = await ttsRes.json();

        chatHistory.push({ role: "assistant", content: replyText });

        if (ttsData.audio_url) {
          currentAudio.src = ttsData.audio_url;
          
          currentAudio.onplay = () => {
            statusEl.innerText = replyText;
            addQuestionToHistory(trimmedQuery, replyText);
            showAudioBadge("播放語音中");
            startLipSync();
          };

          currentAudio.onended = () => {
            clearAudioBadge();
            resetAvatarImage();
          };

          currentAudio.onerror = () => {
            clearAudioBadge();
            resetAvatarImage();
          };

          currentAudio.play().catch(e => {
            console.warn("iOS Autoplay blocked:", e);
            statusEl.innerText = replyText;
            addQuestionToHistory(trimmedQuery, replyText);
            clearAudioBadge();
            resetAvatarImage();
          });
        } else {
          statusEl.innerText = replyText;
          addQuestionToHistory(trimmedQuery, replyText);
          clearAudioBadge();
          resetAvatarImage();
        }

      } catch (error) {
        console.error("Fetch error:", error);
        statusEl.innerText = "網絡請求失敗：" + error.message;
        clearAudioBadge();
        resetAvatarImage();
        chatHistory.pop();
      } finally {
        if (sendBtn) sendBtn.disabled = false;
        if (inputField) {
          inputField.disabled = false;
          inputField.focus();
        }
      }
    }

    function startVoiceInput() {
      const btn = document.querySelector('.btn-voice');
      const input = document.getElementById('text-input');

      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('你的瀏覽器不支援語音辨識功能。');
        return;
      }

      if (isRecording) {
        if (silenceTimer) clearTimeout(silenceTimer);
        if (recognition) recognition.stop();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-HK';
      recognition.continuous = true;
      recognition.interimResults = true;

      isRecording = true;
      btn.innerText = "🔴 錄音中... (點擊完成發問)";
      btn.style.backgroundColor = "#e53935";
      statusEl.innerText = "正在聆聽中，請說出你的問題...";
      input.value = "";

      let finalTranscript = "";

      recognition.onresult = (event) => {
        let interimTranscript = "";

        if (silenceTimer) clearTimeout(silenceTimer);

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        const currentText = finalTranscript || interimTranscript;
        input.value = currentText;
        statusEl.innerText = "聽緊你講： " + currentText;

        silenceTimer = setTimeout(() => {
          if (recognition && isRecording) {
            recognition.stop();
          }
        }, 1800);
      };

      recognition.onerror = (event) => {
        console.error("Speech recognition error:", event.error);
        statusEl.innerText = "語音辨識失敗，請重試。";
        resetVoiceButton();
      };

      recognition.onend = () => {
        resetVoiceButton();
        const textToSend = input.value.trim();
        if (textToSend) {
          handleSend();
        }
      };

      recognition.start();
    }

    function resetVoiceButton() {
      isRecording = false;
      if (silenceTimer) clearTimeout(silenceTimer);
      const btn = document.querySelector('.btn-voice');
      if (btn) {
        btn.innerText = "🎤 按此語音發問";
        btn.style.backgroundColor = "#34a853";
      }
    }
  </script>
</body>
</html>
